[package]
name = "tokenwhy-wrapped"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Water line on the footprint card (EcoLogits water, from core's `co2`).
co2 = ["tokenwhy-core/co2"]

[dependencies]
tokenwhy-core.workspace = true
serde.workspace = true
chrono = { workspace = true, features = ["serde"] }
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }

[dev-dependencies]
tokenwhy-card.workspace = true
serde_json.workspace = true
postcard.workspace = true
serde.workspace = true
