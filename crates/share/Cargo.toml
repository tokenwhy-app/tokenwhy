[package]
name = "tokenwhy-share"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# The only HTTP client in the workspace: posting reports, deleting them, the outbox and its retries.
net = ["dep:ureq", "dep:getrandom"]

[dependencies]
tokenwhy-core.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
ureq = { version = "3.1", default-features = false, features = ["rustls"], optional = true }
getrandom = { version = "0.3", optional = true }
